<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1a2d5a">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">

<title>Little Trikes Academy Attendance</title>
<style>
:root{--ink:#17212e;--mute:#68768a;--bg:#eef2f7;--card:#fff;--line:#dce3ec;--navy:#1a2d5a;--gold:#d4a72c;--maroon:#6b1223;--blue:#2f6fe4;--blue-l:#dce8fc;--g:#2e9e5b;--g-l:#d6f1e1;--r:#d64545;--r-l:#fadada;--y:#e3a008;--y-l:#fdefbd;--o-l:#ffdcbf}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.45 "Segoe UI",system-ui,-apple-system,Roboto,sans-serif;padding-bottom:env(safe-area-inset-bottom)}
button,input,select{font:inherit;color:inherit}button{cursor:pointer}
:focus-visible{outline:2px solid var(--blue);outline-offset:2px}
.top{background:var(--navy);color:#fff;padding:calc(10px + env(safe-area-inset-top)) 16px 10px;display:flex;align-items:center;gap:10px}
.top b{flex:1}.top small{opacity:.75;display:block;font-weight:400}
.wrap{max-width:1000px;margin:0 auto;padding:14px}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:16px;margin-bottom:14px}
h2{font-size:1.05rem;margin:0 0 10px}
.btn{border:1px solid var(--line);background:#fff;border-radius:8px;padding:8px 14px;font-weight:600}
.btn.pri{background:var(--blue);border-color:var(--blue);color:#fff}
.btn.sm{padding:4px 10px;font-size:.85rem}.btn.del{color:var(--r)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.top .btn{background:transparent;color:#fff;border-color:#ffffff66}
input,select{border:1px solid var(--line);border-radius:8px;padding:9px 10px;background:#fff;width:100%}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:10px}
label.l{display:block;font-size:.82rem;color:var(--mute);margin-bottom:3px}
.tabs{display:flex;gap:6px;margin-bottom:12px;overflow-x:auto}
.tab{border:0;background:transparent;padding:8px 14px;border-radius:8px;font-weight:600;color:var(--mute);white-space:nowrap}
.tab[aria-selected=true]{background:var(--navy);color:#fff}
.days{display:flex;flex-wrap:wrap;gap:6px}
.days label{border:1px solid var(--line);border-radius:8px;padding:5px 11px;cursor:pointer;user-select:none}
.days input{position:absolute;opacity:0;width:0}
.days label:has(input:checked){background:var(--blue);border-color:var(--blue);color:#fff}
.tag{display:inline-block;background:var(--blue-l);color:#1d4fb0;border-radius:6px;padding:1px 7px;font-size:.8rem;margin:2px 3px 0 0}
.badge{border-radius:10px;padding:12px 14px;font-weight:700;text-align:center;margin:10px 0}
.badge small{display:block;font-weight:400;opacity:.85}
.badge.ok{background:var(--g-l);color:#12663a}.badge.no{background:var(--r-l);color:#8f2020}.badge.wait{background:var(--blue-l);color:#1d4fb0}
.big{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.big .btn{padding:18px 8px;font-size:1.1rem}
.big .in:not(:disabled){background:var(--g);border-color:var(--g);color:#fff}
.big .out:not(:disabled){background:var(--navy);border-color:var(--navy);color:#fff}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center;padding:9px 0;border-top:1px solid var(--line)}
.row:first-of-type{border-top:0}.row .w{flex:1;min-width:140px}.row small{color:var(--mute);display:block}
.scroll{overflow-x:auto}
table{border-collapse:separate;border-spacing:4px;width:100%;min-width:640px}
th{font-size:.8rem;color:var(--mute);font-weight:600}th.n,td.n{text-align:left;font-weight:600;white-space:nowrap}
td.c{text-align:center;border-radius:8px;font-size:.78rem;padding:8px 3px;min-width:78px}
.s-on{background:var(--g-l);color:#12663a}.s-late{background:var(--y-l);color:#7a5200}.s-early{background:var(--o-l);color:#8a4300}
.s-abs{background:var(--r-l);color:#8f2020}.s-sch{background:var(--blue-l);color:#1d4fb0}.s-off{color:#b3bcc9}
.legend{display:flex;flex-wrap:wrap;gap:8px;margin:8px 0;font-size:.8rem}.legend span{border-radius:6px;padding:2px 9px}
.bar{display:flex;gap:8px;align-items:center;margin-bottom:10px;flex-wrap:wrap}.bar strong{flex:1}
.err{color:var(--r);min-height:1.3em;font-size:.9rem}
.login{max-width:380px;margin:8vh auto}.login .card>*{margin-bottom:10px}
#toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom));transform:translateX(-50%);background:var(--ink);color:#fff;padding:9px 16px;border-radius:8px;opacity:0;pointer-events:none;transition:opacity .2s;max-width:90vw;text-align:center}
#toast.show{opacity:1}
/* ---- Little Trikes Academy branding + ergonomics ---- */
html{-webkit-text-size-adjust:100%}body{font-size:16px;-webkit-tap-highlight-color:transparent}
.top{border-bottom:3px solid var(--gold);gap:12px}
.top img{width:42px;height:42px;border-radius:50%;flex:none}
.top .btn.sm{min-height:44px}
.brand{text-align:center;margin-bottom:6px}.brand img{width:132px;height:132px}
.brand h1{font-size:1.25rem;margin:8px 0 0;color:var(--navy)}.brand p{margin:2px 0 0;color:var(--maroon);font-weight:600}
.btn,.tab{min-height:48px}.btn.sm{min-height:40px;padding:6px 14px}
input,select{font-size:16px;min-height:48px}
.btn.pri{background:var(--navy);border-color:var(--navy)}
.card{border-top:3px solid var(--gold)}
.days label{padding:11px 15px;min-height:44px}
.tabs{position:fixed;left:0;right:0;bottom:0;margin:0;background:#fff;border-top:3px solid var(--gold);padding:6px 8px calc(6px + env(safe-area-inset-bottom));display:grid;grid-auto-flow:column;grid-auto-columns:minmax(96px,1fr);overflow-x:auto;gap:6px;z-index:5}
.tab{text-align:center;font-size:.95rem}.tab[aria-selected=true]{background:var(--navy)}
.wrap:has(.tabs){padding-bottom:96px}
.dock{position:fixed;left:0;right:0;bottom:0;margin:0;padding:10px 14px calc(10px + env(safe-area-inset-bottom));background:#fffffff2;backdrop-filter:blur(8px);border-top:3px solid var(--gold);z-index:5}
.dock .btn{min-height:64px;font-size:1.15rem}
.wrap:has(+ .dock){padding-bottom:calc(96px + env(safe-area-inset-bottom))}
.ov{position:fixed;inset:0;background:#000a;display:grid;place-items:center;padding:16px;z-index:20}.ov .card{width:min(420px,100%);margin:0}
.badge{font-size:1.05rem;padding:16px 14px}
#toast{bottom:calc(92px + env(safe-area-inset-bottom))}
@media(min-width:760px){.dock,.tabs{left:50%;right:auto;width:min(760px,100%);transform:translateX(-50%);border-radius:14px 14px 0 0}}
@media(prefers-reduced-motion:reduce){*{transition:none!important;scroll-behavior:auto!important}}
.lf{display:grid;gap:10px}.pwb{position:relative}.pwb input{padding-right:84px}.pwb .btn{position:absolute;right:4px;top:4px;min-height:40px}
.pt{min-width:980px;border-spacing:0}.pt th,.pt td{padding:8px 8px;text-align:right;white-space:nowrap;border-bottom:1px solid var(--line)}.pt th.n,.pt td.n{text-align:left}.pt tfoot td{font-weight:700;border-top:2px solid var(--navy)}.pt input{width:76px;min-height:40px;padding:4px 8px;text-align:right}.pt tr.flag td{background:var(--y-l)}
.kpi{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin-bottom:14px}.kp{background:#fff;border:1px solid var(--line);border-top:3px solid var(--gold);border-radius:12px;padding:12px}.kp b{display:block;font-size:1.5rem;line-height:1.2}.kp span{color:var(--mute);font-size:.82rem}
</style>
</head>
<body>
<div id="app"></div>
<div id="toast" role="status"></div>
<script type="module">
import {initializeApp} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import {getAuth,onAuthStateChanged,signInWithEmailAndPassword,signOut,createUserWithEmailAndPassword} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
import {getFirestore,doc,getDoc,setDoc,deleteDoc,collection,getDocs,query,where} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

/* ===== 1. PASTE YOUR FIREBASE WEB CONFIG HERE ===== */
const cfg={apiKey:"AIzaSyBq9R2mkexK8fZ7aDMORR-4u_fQ1OwwQUg",authDomain:"little-trikes-attendance.firebaseapp.com",projectId:"little-trikes-attendance",storageBucket:"little-trikes-attendance.firebasestorage.app",messagingSenderId:"142111712131",appId:"1:142111712131:web:73f7f93c4282893cdf0cb6"};
const GRACE=5, LEAD=10; // minutes of grace before "Late"; minutes before shift for reminders
const FACILITY_NAME="Little Trikes Academy, Bin Sagar Tower, AD 46 Najda St, Abu Dhabi, UAE";

const app=initializeApp(cfg),auth=getAuth(app),db=getFirestore(app);
const $=s=>document.querySelector(s),DAYS=['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const pad=n=>String(n).padStart(2,'0'),ymd=d=>d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
const pd=s=>{const [a,b,c]=s.split('-').map(Number);return new Date(a,b-1,c)};
const tm=s=>{const [h,m]=s.split(':').map(Number);return h*60+m},mins=d=>d.getHours()*60+d.getMinutes();
const hm=ms=>{const d=new Date(ms);return pad(d.getHours())+':'+pad(d.getMinutes())};
const W=o=>Object.assign(window,o);
function toast(m){const t=$('#toast');t.textContent=m;t.className='show';clearTimeout(toast.t);toast.t=setTimeout(()=>t.className='',3200)}
const todayS=()=>ymd(new Date());
let me=null,fac={},tab='dash',weekStart=mon(new Date()),editing=null,ver=null;
function mon(d){const x=new Date(d);x.setDate(x.getDate()-((x.getDay()+6)%7));x.setHours(0,0,0,0);return x}

/* ---------- Auth ---------- */
onAuthStateChanged(auth,async u=>{
 if(!u){me=null;return loginView()}
 const s=await getDoc(doc(db,'users',u.uid));
 if(!s.exists()){await signOut(auth);return loginView('No access: your account has no profile. Contact your admin.')}
 me={uid:u.uid,...s.data()};
 await loadCfg();
 me.role==='admin'?adminView():empView();
});
function loginView(err=''){
 $('#app').innerHTML=`<div class="login"><div class="card"><div class="brand"><img src="logo.png" alt="Little Trikes Academy logo"><h1>Little Trikes Academy</h1><p>Staff Attendance</p></div>
 <form id="lf" class="lf" action="#"><input id="em" name="username" type="email" placeholder="Email" autocomplete="username" autocapitalize="none" spellcheck="false"><div class="pwb"><input id="pw" name="password" type="password" placeholder="Password" autocomplete="current-password"><button type="button" class="btn sm" id="sp">Show</button></div>
 <div class="err" id="le">${esc(err)}</div><button class="btn pri" style="width:100%" id="lg" type="submit">Sign in</button></form></div></div>`;
 const go=async()=>{try{await signInWithEmailAndPassword(auth,$('#em').value.trim(),$('#pw').value)}catch(e){$('#le').textContent='Wrong email or password.'}};
 $('#lf').onsubmit=e=>{e.preventDefault();go()};
 $('#sp').onclick=()=>{const p=$('#pw'),h=p.type==='password';p.type=h?'text':'password';$('#sp').textContent=h?'Hide':'Show';p.focus()}}
const header=r=>`<div class="top"><img src="logo.png" alt=""><b>${esc(me.name)}<small>${r} · Little Trikes Academy</small></b><button class="btn sm" onclick="signOutNow()">Sign out</button></div>`;
W({signOutNow:()=>signOut(auth)});

/* ---------- Rules, status & verification ---------- */
let rules={grace:15,breakMin:60,mode:'either'},branches=[],grades=[],retries=0,first=null;const T0=Date.now();
async function loadCfg(){const r=await getDoc(doc(db,'settings','rules'));rules={...rules,...(r.exists()?r.data():{})};
 branches=(await getDocs(collection(db,'branches'))).docs.map(d=>({id:d.id,...d.data()}));
 if(me?.role==='admin'){try{grades=(await getDocs(collection(db,'salaryGrades'))).docs.map(d=>({id:d.id,...d.data()})).sort((a,b)=>String(a.code).localeCompare(String(b.code),undefined,{numeric:true}))}catch(e){grades=[];toast('Cannot read salaryGrades. Update Firestore rules.')}}}
const cls=r=>!r?'':r.outStatus==='Early Out'?'s-early':r.inStatus==='Late'?'s-late':'s-on';
const REASONS=['Traffic / Transit','Official Errand','Medical','System Issue','Other (unexcused)'];
const askReason=t=>new Promise(res=>{const d=document.createElement('div');d.className='ov';
 d.innerHTML=`<div class="card"><h2>${t}</h2><label class="l">Reason</label><select id="rs">${REASONS.map(x=>`<option>${x}</option>`).join('')}</select><p style="color:var(--mute);font-size:.85rem">Your admin reviews reasons before they excuse any minutes.</p><div class="bar"><button class="btn" id="rc">Cancel</button><button class="btn pri" id="ro">Confirm</button></div></div>`;
 document.body.appendChild(d);$('#rc').onclick=()=>{d.remove();res(null)};$('#ro').onclick=()=>{const v=$('#rs').value;d.remove();res(v)}});
function hav(a,b,c,d){const R=6371000,t=x=>x*Math.PI/180,dl=t(c-a),dn=t(d-b);
 const h=Math.sin(dl/2)**2+Math.cos(t(a))*Math.cos(t(c))*Math.sin(dn/2)**2;return 2*R*Math.asin(Math.sqrt(h))}
async function getIP(){return (await (await fetch('https://api.ipify.org?format=json')).json()).ip}
const getPos=()=>new Promise((res,rej)=>navigator.geolocation.getCurrentPosition(res,rej,{enableHighAccuracy:true,timeout:15000,maximumAge:0}));
async function verify(){
 const mine=branches.filter(b=>b.id===me.primaryBranchId||(me.allowedBranchIds||[]).includes(b.id)).sort((a,b)=>(b.id===me.primaryBranchId)-(a.id===me.primaryBranchId)),md=b=>b.mode||rules.mode||'either';
 const r={ip:null,dist:null,ok:false,branch:null,mode:md(mine[0]||{})};let p=null;
 if(mine.some(b=>md(b)!=='gps')){try{r.ip=await getIP()}catch(e){}}
 if(mine.some(b=>md(b)!=='ip')){try{p=await getPos();r.lat=p.coords.latitude;r.lng=p.coords.longitude}catch(e){}}
 for(const b of mine){const m=md(b),ipOk=!!r.ip&&(b.officeIPs||[]).includes(r.ip),d=p&&b.lat!=null&&b.lat!==''?Math.round(hav(+b.lat,+b.lng,r.lat,r.lng)):null,gOk=d!==null&&d<=(+b.radius||50);
  if(r.dist===null&&d!==null)r.dist=d;
  if(m==='ip'?ipOk:m==='gps'?gOk:m==='both'?ipOk&&gOk:ipOk||gOk){r.ok=true;r.branch=b;r.dist=d;r.mode=m;r.method=ipOk&&gOk?'Office_IP+GPS':ipOk?'Office_IP':'GPS';break}}
 return r}

/* ---------- Employee view ---------- */
async function empView(){
 $('#app').innerHTML=header('Employee')+`<div class="wrap"><div class="card"><h2>Today · ${new Date().toLocaleDateString(undefined,{weekday:'long',day:'numeric',month:'long'})}</h2>
 <div id="shift"></div><div id="badge" class="badge wait">Checking location…</div><p id="rec" style="color:var(--mute);margin-bottom:0"></p><button class="btn sm" style="margin-top:8px" id="re">Re-check location</button></div>
 <div class="card"><h2>Attendance rules</h2><ul style="margin:0;padding-left:18px;color:var(--mute)"><li><b>Late:</b> Time In more than ${rules.grace} min after your start time.</li><li><b>Early Out:</b> Time Out before your end time. It only counts if you have a Time In today.</li><li>${rules.breakMin} min unpaid break is deducted from net hours.</li><li>Late or Early Out asks for a reason, which your admin reviews.</li></ul></div>
 <div class="card"><h2>Reminders</h2><p style="margin-top:0;color:var(--mute)">Get a notification ${LEAD} minutes before Time In and Time Out.</p><button class="btn" id="rem"></button></div>
 <div class="card"><h2>Request leave</h2><div class="grid"><div><label class="l">From</label><input id="ld1" type="date"></div><div><label class="l">To (blank = same day)</label><input id="ld2" type="date"></div></div><label class="l" style="margin-top:10px">Reason</label><input id="lrs" placeholder="e.g. Medical, family matter"><p class="err" id="lre"></p><button class="btn pri" id="lsub">Submit request</button><div id="llist" style="margin-top:10px"></div></div>
 <div class="card"><h2>Recent attendance</h2><div id="hist"></div></div></div>
 <div class="big dock"><button class="btn in" id="bin" disabled>Time In</button><button class="btn out" id="bout" disabled>Time Out</button></div>`;
 const works=me.days.includes(new Date().getDay()),id=me.uid+'_'+todayS();let rec=(await getDoc(doc(db,'attendance',id))).data();
 $('#shift').innerHTML=`<strong>${works?esc(me.start)+' – '+esc(me.end):'Day off'}</strong><div>${me.days.map(d=>`<span class="tag">${DAYS[d]}</span>`).join('')}</div>`;
 const showRec=()=>{$('#rec').textContent=rec?`In ${hm(rec.timeIn)} (${rec.inStatus})${rec.timeOut?' · Out '+hm(rec.timeOut)+' ('+rec.outStatus+') · '+rec.netHours+' h net':''}`:'No record yet today.';
  $('#bin').disabled=!(ver?.ok&&works&&!rec);$('#bout').disabled=!(ver?.ok&&rec&&!rec.timeOut)};
 const check=async()=>{$('#badge').className='badge wait';$('#badge').textContent='Checking location…';ver=await verify();if(first===null)first=ver.ok;
  const none=!branches.some(b=>b.id===me.primaryBranchId),d=[ver.ip?'IP '+ver.ip:'',ver.dist!=null?ver.dist+' m from branch':''].filter(Boolean).join(' · ');
  $('#badge').className='badge '+(ver.ok?'ok':'no');
  $('#badge').innerHTML=(ver.ok?'Connected to Facility Zone · '+esc(ver.branch.name):ver.mode==='gps'?'Outside Facility - Move closer to your branch':'Outside Facility - Connect to Office Wi-Fi')+`<small>${esc(none?'No branch assigned. Ask your admin.':d||'Location unavailable. Allow location access.')}</small>`;showRec()};
 const punch=async out=>{(out?$('#bout'):$('#bin')).disabled=true;
  if(out&&(!rec?.timeIn||Date.now()-rec.timeIn<120000)){toast('Time Out needs a Time In at least 2 minutes earlier.');return showRec()}
  ver=await verify();if(!ver.ok){toast('Verification failed. You are not at an allowed branch.');return check()}
  const now=Date.now(),n=mins(new Date(now)),v={ip:ver.ip||'',lat:ver.lat??null,lng:ver.lng??null};
  try{
   if(out){const under=Math.max(0,tm(me.end)-n),early=under>0;let rs=null;
    if(early){rs=await askReason('Leaving early');if(!rs)return showRec()}
    rec={...rec,timeOut:now,outStatus:early?'Early Out':'Completed',undertimeMinutes:under,breakMinutes:+rules.breakMin,netHours:Math.round(Math.max(0,(now-rec.timeIn)/60000-rules.breakMin)/60*100)/100,outVerify:v};
    if(early){rec.outReason=rs;rec.reasonStatus='pending'}}
   else{const late=Math.max(0,n-tm(me.start)-rules.grace),isLate=late>0;let rs=null;
    if(isLate){rs=await askReason('You are late');if(!rs)return showRec()}
    rec={uid:me.uid,name:me.name,date:todayS(),timeIn:now,inStatus:isLate?'Late':'On Time',lateMinutes:late,branchId:ver.branch.id,branchName:ver.branch.name,start:me.start,end:me.end,
     verificationMethod:ver.method,clockInCycleSeconds:Math.round((now-T0)/1000),locationRetries:retries,firstPassOk:first===true,manualOverride:false,inVerify:v};
    if(isLate){rec.lateReason=rs;rec.reasonStatus='pending'}}
   await setDoc(doc(db,'attendance',id),rec,{merge:true});toast(out?'Timed out.':'Timed in.');navigator.vibrate?.(60)}catch(e){toast('Could not save: '+e.code)}
  showRec();loadHist()};
 $('#bin').onclick=()=>punch(false);$('#bout').onclick=()=>punch(true);$('#re').onclick=()=>{retries++;check()};
 const loadHist=async()=>{const s=await getDocs(query(collection(db,'attendance'),where('uid','==',me.uid)));
  const l=s.docs.map(d=>d.data()).sort((a,b)=>b.date.localeCompare(a.date)).slice(0,10);
  $('#hist').innerHTML=l.length?l.map(r=>`<div class="row"><div class="w"><strong>${r.date}</strong><small>${esc(r.branchName||'')} · In ${hm(r.timeIn)}${r.timeOut?' · Out '+hm(r.timeOut)+' · '+r.netHours+' h':' · no Time Out'}</small></div><span class="tag ${cls(r)}">${r.outStatus==='Early Out'?'Early Out':r.inStatus}</span></div>`).join(''):'<small>No records yet.</small>'};
 loadHist();check();setupReminders();empLeave();
 const rb=$('#rem'),upd=()=>rb.textContent=localStorage.remind==='1'&&Notification.permission==='granted'?'Reminders on (tap to turn off)':'Enable reminders';
 upd();rb.onclick=async()=>{if(localStorage.remind==='1'){localStorage.remind='0'}else{
  if(!('Notification' in window))return toast('Notifications are not supported here.');
  if(await Notification.requestPermission()==='granted'){localStorage.remind='1';notify('Reminders enabled','You will be notified before your shift.')}else toast('Notifications blocked in browser settings.')}upd()}}

/* ---------- Reminders (fire while the app is open or running in background) ---------- */
async function notify(t,b){const r=await navigator.serviceWorker?.getRegistration();r?r.showNotification(t,{body:b,tag:t,vibrate:[200,100,200]}):new Notification(t,{body:b})}
function setupReminders(){
 const tick=()=>{if(localStorage.remind!=='1'||Notification.permission!=='granted'||!me.days.includes(new Date().getDay()))return;
  const n=mins(new Date()),d=todayS();
  [['in',me.start,'Time In'],['out',me.end,'Time Out']].forEach(([k,t,l])=>{const left=tm(t)-n,key='n_'+k+'_'+d;
   if(left>=0&&left<=LEAD&&!localStorage[key]){localStorage[key]=1;notify(l+' reminder',left?`${l} is due in ${left} min (${t}). Open the app at the facility to tap ${l}.`:`${l} is due now.`)}})};
 clearInterval(setupReminders.t);setupReminders.t=setInterval(tick,30000);tick();document.addEventListener('visibilitychange',tick)}

/* ---------- Admin view ---------- */

  return{...o,daily,hr,mr,payable:hourly?net+pl*hrs:present+pl,gross,ld,ud,ad,total:Math.max(0,gross-ld-ud-ad)}});

let imp=[];
const toPw=v=>{let d=String(v).replace(/[oO]/g,'0').replace(/\D/g,'');d=d.replace(/^(00)?971/,'0');if(d.length===9&&d[0]==='5')d='0'+d;return d};
const to24=v=>{const m=String(v).trim().match(/^(\d{1,2}):(\d{2})(?::\d{2})?\s*([AP]M)?$/i);if(!m)return'';let h=+m[1];if(m[3])h=h%12+(/p/i.test(m[3])?12:0);return h<24&&+m[2]<60?pad(h)+':'+m[2]:''};
const key=v=>String(v).toLowerCase().replace(/branch|[^a-z]/g,'');
const matchBranch=v=>{const k=key(v);return k?branches.find(b=>key(b.name).includes(k))?.id||'':''};
function parseSheet(text){
 const rows=text.split(/\r?\n/).filter(l=>l.trim()).map(l=>l.split('\t'));
 if(rows.length<2)throw new Error('Paste the header row and at least one employee row.');
 const h=rows[0].map(x=>x.trim().toLowerCase()),col=n=>{const i=h.findIndex(x=>x===n||x.startsWith(n+' -'));if(i<0)throw new Error('Column "'+n+'" not found. Include the header row.');return i};
 const c={name:col('full name'),email:col('email'),phone:col('contact number'),branch:col('primary branch'),days:col('work day (select all that applies)'),start:col('start time'),end:col('end time')};
 const alt=h.indexOf('email address'),byEmail=new Map();
 rows.slice(1).forEach(r=>{const g=i=>(r[i]||'').trim(),email=(g(c.email)||(alt<0?'':g(alt))).toLowerCase();
  byEmail.set(email||'row'+byEmail.size,{name:g(c.name).replace(/\s+/g,' '),email,pw:toPw(g(c.phone)),sheetBranch:g(c.branch),branch:matchBranch(g(c.branch)),
   days:DAYS.map((d,i)=>g(c.days).toLowerCase().includes(d.toLowerCase())?i:-1).filter(i=>i>=0),start:to24(g(c.start)),end:to24(g(c.end))})});
 return[...byEmail.values()]}
const impProblem=r=>!r.name?'No name':!/^\S+@\S+\.\S+$/.test(r.email)?'Invalid email':r.pw.length<6?'Phone number too short':!r.days.length?'No work days':!r.start||!r.end?'Missing time':r.end<=r.start?'End time is not after start time':!r.branch?'Choose a branch':'';
function impDraw(){
 $('#imv').innerHTML=`<div class="scroll"><table class="pt"><thead><tr><th class="n">Employee</th><th>Password</th><th>Days</th><th>Start</th><th>End</th><th>Branch</th><th>Status</th><th></th></tr></thead><tbody>${imp.map((r,i)=>`<tr${impProblem(r)&&!r.status?' class="flag"':''}><td class="n">${esc(r.name)}<small style="display:block;font-weight:400">${esc(r.email)}</small></td><td>${esc(r.pw)}</td><td>${r.days.map(d=>DAYS[d]).join(' ')}</td><td><input type="time" value="${r.start}" onchange="impSet(${i},'start',this.value)"></td><td><input type="time" value="${r.end}" onchange="impSet(${i},'end',this.value)"></td><td><select onchange="impSet(${i},'branch',this.value)"><option value="">${esc(r.sheetBranch||'Select')}?</option>${branches.map(b=>`<option value="${b.id}"${r.branch===b.id?' selected':''}>${esc(b.name)}</option>`).join('')}</select></td><td style="text-align:left">${esc(r.status||impProblem(r)||'Ready')}</td><td>${!r.status&&!impProblem(r)?`<button class="btn sm pri" onclick="impApprove(${i})"${impBusy?' disabled':''}>Approve</button>`:''}</td></tr>`).join('')}</tbody></table></div>
 <button class="btn pri" style="margin-top:10px" id="imgo"${!impBusy&&imp.some(r=>!r.status&&!impProblem(r))?'':' disabled'}>Approve all ready (${imp.filter(r=>!r.status&&!impProblem(r)).length})</button>`;
 $('#imgo').onclick=()=>impRun(imp.filter(r=>!r.status&&!impProblem(r)))}
let impBusy=false,sheetUrl='';
const loadSheetUrl=async()=>{try{sheetUrl=(await getDoc(doc(db,'settings','sheet'))).data()?.url||''}catch(e){}if($('#imu'))$('#imu').value=sheetUrl};
async function sheetCall(body){
 if(!sheetUrl)throw new Error('Add the web app URL under Setup first.');
 const res=await fetch(sheetUrl,{method:'POST',body:JSON.stringify({...body,token:await auth.currentUser.getIdToken()})});
 const j=await res.json();if(!j.ok)throw new Error(j.error);return j}
async function impRun(todo){
 if(impBusy||!todo.length)return;
 if(!confirm('Approve '+(todo.length===1?todo[0].name:todo.length+' employees')+'? This creates the account'+(sheetUrl?' and emails the login.':'. No email will be sent.')))return;
 impBusy=true;impDraw();
 try{
 const have=new Set((await employees()).map(u=>String(u.email).toLowerCase()));
 const sa=getAuth(initializeApp(cfg,'imp'+Date.now()));
 for(const r of todo){
  if(have.has(r.email)){r.status='Skipped: already in the app';continue}
  let user=null;
  try{user=(await createUserWithEmailAndPassword(sa,r.email,r.pw)).user;
   await setDoc(doc(db,'users',user.uid),{name:r.name,email:r.email,role:'employee',start:r.start,end:r.end,days:r.days,primaryBranchId:r.branch,allowedBranchIds:[],salaryGradeId:'',customRateOverride:null});
   r.status='Created';
   if(sheetUrl){try{await sheetCall({action:'email',email:r.email,password:r.pw});r.status='Created and emailed'}catch(x){r.status='Created, email not confirmed: '+x.message}}
   else r.status='Created, not emailed'}
  catch(x){if(user){try{await user.delete()}catch(e){}}
   r.status=x.code==='auth/email-already-in-use'?'Skipped: login already exists (check Firebase Authentication)':'Failed: '+(x.code||x.message)}
  try{await signOut(sa)}catch(e){}
  if($('#imv'))impDraw()}
 toast(todo.filter(r=>r.status.startsWith('Created')).length+' account(s) created.');
 }finally{impBusy=false}
 if(tab==='emp')empPane()}
W({impApprove:i=>impRun([imp[i]]),
 impSaveUrl:async()=>{const u=$('#imu').value.trim(),er=$('#ime');er.textContent='';
  if(u&&!/^https:\/\/script\.google\.com\/.+\/exec$/.test(u))return er.textContent='Paste the web app URL that ends in /exec.';
  try{await setDoc(doc(db,'settings','sheet'),{url:u});sheetUrl=u;toast('Saved.')}catch(e){er.textContent='Could not save: '+(e.code||e.message)}},
 impLoad:async()=>{const er=$('#ime');er.textContent='';if(impBusy)return;
  try{await loadSheetUrl();const {rows}=await sheetCall({action:'list'});imp=parseSheet(rows.map(r=>r.join('\t')).join('\n'));
   const have=new Set((await employees()).map(u=>String(u.email).toLowerCase()));
   imp.forEach(r=>{if(have.has(r.email))r.status='Already in the app'});impDraw()}catch(e){er.textContent='Could not load: '+e.message}},
 impSet:(i,k,v)=>{imp[i][k]=v;impDraw()}});
